name: Rebuild NBA Travel Tax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run five-season analysis
        run: python src/analysis.py

      - name: Build figures, notebook, and brief
        run: python src/build_assets.py

      - name: Build geospatial dashboard
        run: python src/build_dashboard.py

      - name: Validate generated project artifacts
        run: |
          test -f outputs/findings.json
          test -f outputs/ols_two_way_clustered.txt
          test -f figures/arena_geography.svg
          test -f dashboard/index.html
          test -f data/arena_locations.csv
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path("outputs/findings.json").read_text())
          assert f["games"] == 6000
          assert f["team_game_rows"] == 12000
          assert f["model_games"] == 5596
          assert f["clustered_p"] < 0.001
          print("Validated:", f["games"], "games;", f["team_game_rows"], "team-game rows")
          PY

      - name: Upload rebuilt portfolio artifact
        uses: actions/upload-artifact@v4
        with:
          name: nba-travel-tax-rebuild
          path: |
            outputs/
            figures/
            dashboard/
            data/arena_locations.csv
            notebooks/
            docs/NBA_Travel_Tax_Findings_Brief.pdf
