name: Rebuild NBA Travel Tax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run five-season analysis
        run: python src/analysis.py

      - name: Build figures, notebook, and brief
        run: python src/build_assets.py

      - name: Build geospatial dashboard
        run: python src/build_dashboard.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs figures notebooks dashboard data/arena_locations.csv docs/NBA_Travel_Tax_Findings_Brief.pdf
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Rebuild verified NBA analysis outputs [skip ci]"
            git pull --rebase origin main
            git push
          fi
